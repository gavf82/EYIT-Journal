appId: com.eyit.journal
productName: EYIT Development Journal
copyright: Copyright © 2024-2026 EYIT

directories:
  output: release
  # Icon assets: place platform icons in build/icons/
  # (256x256+ PNG for Linux/Mac, ICO for Windows, ICNS for macOS).
  # If absent, electron-builder falls back to the default Electron icon.
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json
  # node_modules is intentionally NOT listed here so that electron-builder
  # uses its built-in pnpm-aware dependency collection (introduced in v24).
  # When node_modules/** is listed explicitly, electron-builder globs only the
  # direct symlinks visible in this package's node_modules/ and misses all
  # transitive deps that pnpm stores in the workspace virtual store (.pnpm/).
  # Without the explicit glob, electron-builder traverses pnpm-lock.yaml and
  # copies every runtime dep (including fs-extra, js-yaml, etc.) from the
  # virtual store into the packaged app.

# Disable electron-builder's built-in npm rebuild: on Windows it tries to
# fork/exec pnpm.cjs as a native Win32 binary, which fails.  Instead, we run
# @electron/rebuild explicitly in CI before invoking electron-builder (see the
# "Rebuild native modules for Electron" step in the GitHub Actions workflows).
npmRebuild: false
asar: true

# Native addons (.node files) cannot be loaded from inside an ASAR archive —
# the OS linker needs them on real disk.  This pattern extracts every .node
# binary to app.asar.unpacked/ so Electron can dlopen() them.
asarUnpack:
  - "**/*.node"

# ── GitHub Releases publish target ────────────────────────────────────────────
# Tells electron-updater where to find new releases and electron-builder where
# to publish installers.
#
# To publish a new release:
#   1. Create the GitHub repository gavf82/EYIT-Journal if it does not exist.
#   2. Set GH_TOKEN in your environment (a personal access token with repo scope).
#   3. Run `pnpm dist` — electron-builder builds installers, uploads them, and
#      writes the latest.yml / latest-mac.yml / latest-linux.yml feed files that
#      electron-updater reads on each app launch.
publish:
  - provider: github
    owner: gavf82
    repo: EYIT-Journal
    releaseType: release

win:
  # signAndEditExecutable: false skips BOTH the rcedit icon-embedding step
  # AND the signing step, so app-builder.exe is never invoked on Windows.
  # The binary from app-builder-bin crashes on GitHub Actions Windows runners
  # regardless of version.  The produced installer is unsigned, which is
  # acceptable for CI builds; remove this line and configure WIN_CSC_LINK when
  # a code signing certificate is available (see CODESIGNING.md).
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  # Copy vc_redist.x64.exe into the NSIS installer package so installer.nsh
  # can find it at $INSTDIR\resources\vc_redist.x64.exe during installation.
  # Scoped to win: so macOS and Linux builds do not require the file.
  # Download it with scripts/download-vcredist.sh before running electron-builder.
  # The installer.nsh macro deletes it from $INSTDIR after running — it is not
  # needed at runtime.
  extraResources:
    - from: build/vc_redist.x64.exe
      to: vc_redist.x64.exe

mac:
  # Code signing is optional — electron-builder skips it when CSC_LINK and
  # CSC_KEY_PASSWORD are absent.
  # Notarization is disabled until Apple Developer credentials are available
  # (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID).  Set
  # notarize: true and add those GitHub secrets to re-enable (see CODESIGNING.md).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.education

linux:
  # Explicit 512x512 PNG path — Linux is case-sensitive; the filename and this
  # value must match exactly (icon.png, not Icon.png or icon.PNG).
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  category: Education

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Custom NSIS fragment that silently installs the VC++ 2015-2022 x64
  # redistributable before the app installs, if it is not already present.
  # build/vc_redist.x64.exe must exist before running electron-builder —
  # download it with scripts/download-vcredist.sh or the CI step in the
  # GitHub Actions workflows.
  include: build/installer.nsh
