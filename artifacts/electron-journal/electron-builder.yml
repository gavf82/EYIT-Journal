appId: com.eyit.journal
productName: EYIT Development Journal
copyright: Copyright © 2024-2026 EYIT

# Icon assets: place platform icons in build/icons/
# (256x256+ PNG for Linux/Mac, ICO for Windows, ICNS for macOS).
# If absent, electron-builder falls back to the default Electron icon.
buildResources: build

directories:
  output: release

files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/**

npmRebuild: true
asar: true

win:
  target:
    - target: nsis
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.education

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Education

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
