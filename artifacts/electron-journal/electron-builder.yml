appId: com.eyit.journal
productName: EYIT Development Journal
copyright: Copyright © 2024-2026 EYIT

directories:
  output: release
  # Icon assets: place platform icons in build/icons/
  # (256x256+ PNG for Linux/Mac, ICO for Windows, ICNS for macOS).
  # If absent, electron-builder falls back to the default Electron icon.
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/**

npmRebuild: true
asar: true

# ── GitHub Releases publish target ────────────────────────────────────────────
# Tells electron-updater where to find new releases and electron-builder where
# to publish installers.
#
# To publish a new release:
#   1. Create the GitHub repository gavf82/EYIT-Journal if it does not exist.
#   2. Set GH_TOKEN in your environment (a personal access token with repo scope).
#   3. Run `pnpm dist` — electron-builder builds installers, uploads them, and
#      writes the latest.yml / latest-mac.yml / latest-linux.yml feed files that
#      electron-updater reads on each app launch.
publish:
  - provider: github
    owner: gavf82
    repo: EYIT-Journal
    releaseType: release

win:
  # electron-builder reads WIN_CSC_LINK (base64-encoded PFX) and
  # WIN_CSC_KEY_PASSWORD automatically when present.  When those env vars are
  # absent (e.g. during a local dev build) signing is silently skipped.
  signingHashAlgorithms:
    - sha256
  target:
    - target: nsis
      arch:
        - x64

mac:
  # electron-builder reads CSC_LINK (base64-encoded .p12) and CSC_KEY_PASSWORD
  # automatically when present.
  #
  # Notarization: electron-builder v25 reads APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
  # and APPLE_TEAM_ID from the environment.  Set notarize: true to enable.
  notarize: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.education

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Education

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
