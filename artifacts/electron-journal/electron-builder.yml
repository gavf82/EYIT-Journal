appId: com.eyit.journal
productName: EYIT Development Journal
copyright: Copyright © 2024-2026 EYIT

# Icon assets: place platform icons in build/icons/
# (256x256+ PNG for Linux/Mac, ICO for Windows, ICNS for macOS).
# If absent, electron-builder falls back to the default Electron icon.
buildResources: build

directories:
  output: release

files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/**

npmRebuild: true
asar: true

# ── GitHub Releases publish target ────────────────────────────────────────────
# This section tells electron-updater where to find new releases.
# It is intentionally left with placeholder values until a GitHub repository
# is created for distribution (tracked as a separate task).
#
# To activate auto-update publishing:
#   1. Create a GitHub repository for desktop releases.
#   2. Replace PLACEHOLDER_OWNER and PLACEHOLDER_REPO below with the real values.
#   3. Set a GH_TOKEN environment variable with repo write permission.
#   4. Run `pnpm dist` to build installers and publish a release.
#
# The main process guards setupAutoUpdater() with `app.isPackaged` AND checks
# that these env values are not placeholders at runtime, so shipping with
# placeholders does not cause errors in packaged builds — the check is simply
# skipped.
publish:
  - provider: github
    owner: PLACEHOLDER_OWNER
    repo: PLACEHOLDER_REPO
    releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.education

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Education

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
