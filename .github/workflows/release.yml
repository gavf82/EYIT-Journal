name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Guard: ensure the pushed tag matches the version in package.json ──────────
  # This prevents a common mistake where a developer bumps the tag but forgets
  # to update package.json (or vice-versa), which would publish assets whose
  # feed files report a version different from the GitHub Release tag and break
  # electron-updater's version comparison.
  validate:
    name: Validate tag vs package.json version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches package version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./artifacts/electron-journal/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json reports $PKG_VERSION but the tag is $GITHUB_REF_NAME (expected v$PKG_VERSION)"
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

  # ── Phase 1: create the GitHub Release as a draft ────────────────────────────
  # All three matrix build jobs race to create the release and the last one to
  # arrive gets a 422 "already exists" from GitHub, failing the job.  Avoid this
  # by pre-creating a draft release in a single dedicated job; the matrix jobs
  # then just upload assets to the existing release.
  create-release:
    name: Create GitHub release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME"

  # ── Phase 2: build & publish one installer per platform ──────────────────────
  # Each matrix job builds its platform installer and uploads assets to the
  # already-created GitHub Release.  electron-builder's --publish always updates
  # the existing draft release (no creation attempt, no race condition).
  # A final job then un-drafts the release once all three builds succeed.
  release:
    name: Build & publish (${{ matrix.label }})
    needs: [validate, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Linux requires these system libraries to build native modules and
      # produce an AppImage.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xvfb \
            fuse \
            libfuse2

      # On Windows and macOS, delete the lockfile before installing so pnpm
      # does a fresh platform-specific resolution and picks up the correct
      # native Rollup binary (@rollup/rollup-win32-x64-msvc etc.).
      # The lockfile was generated on Linux and marks those binaries as '-'
      # (excluded), which persists even with --no-frozen-lockfile.
      - name: Clear lockfile for platform-native resolution
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: rm -f pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # macOS requires an ICNS file for the DMG icon.  Generate it from the
      # committed PNG placeholder using macOS-only iconutil — but only if the
      # source PNG exists (when icons are absent, electron-builder uses the
      # default Electron icon).
      - name: Generate macOS ICNS icon
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          SRC=artifacts/electron-journal/build/icon.png
          if [ ! -f "$SRC" ]; then
            echo "No icon.png found — skipping ICNS generation, using default Electron icon."
            exit 0
          fi
          ICONSET=icon.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size "$SRC" --out "$ICONSET/icon_${size}x${size}.png"
            sips -z $((size*2)) $((size*2)) "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o artifacts/electron-journal/build/icon.icns
          rm -rf "$ICONSET"

      # Download the VC++ 2015-2022 x64 redistributable so electron-builder can
      # bundle it inside the NSIS installer.  The installer.nsh macro runs it
      # silently on target machines that don't already have the runtime, which
      # is required for better-sqlite3's native module to load.
      # Only needed on the Windows runner — the file is ignored on other platforms.
      - name: Download VC++ redistributable (Windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -o artifacts/electron-journal/build/vc_redist.x64.exe \
            "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          echo "Downloaded vc_redist.x64.exe ($(du -sh artifacts/electron-journal/build/vc_redist.x64.exe | cut -f1))"

      - name: Verify vc_redist.x64.exe is present (Windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          REDIST="artifacts/electron-journal/build/vc_redist.x64.exe"
          if [ ! -f "$REDIST" ]; then
            echo "::error::build/vc_redist.x64.exe is missing. The Windows NSIS installer requires it. Run scripts/download-vcredist.sh first."
            exit 1
          fi
          echo "vc_redist.x64.exe present ($(du -sh "$REDIST" | cut -f1)) — ready for electron-builder."

      # Rebuild better-sqlite3 against Electron's Node.js headers.
      # We use npx (runs through Node) to avoid the Windows failure where
      # electron-builder's fork/exec tries to run pnpm.cjs as a Win32 binary.
      - name: Rebuild native modules for Electron
        working-directory: artifacts/electron-journal
        shell: bash
        run: npx --yes @electron/rebuild@3 -f -w better-sqlite3

      # Pass signing secrets into the environment only when they are non-empty.
      # Passing an empty string for CSC_LINK / WIN_CSC_LINK causes electron-builder
      # to resolve it as a file path (CWD), which triggers a "not a file" error.
      # By writing to GITHUB_ENV here we ensure the variables are present only when
      # a real value exists, so unsigned builds remain clean.
      - name: Configure Windows code signing
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          _WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          _WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$_WIN_CSC_LINK" ]; then
            echo "WIN_CSC_LINK=$_WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$_WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "WIN_CSC_LINK is set — Windows installer will be signed."
          else
            echo "WIN_CSC_LINK not configured — Windows installer will be unsigned."
          fi

      # Pass macOS signing and notarization secrets only when present.
      - name: Configure macOS code signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          _CSC_LINK: ${{ secrets.CSC_LINK }}
          _CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$_CSC_LINK" ]; then
            echo "CSC_LINK=$_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "CSC_LINK is set — macOS app will be signed."
          else
            echo "CSC_LINK not configured — macOS app will be unsigned."
          fi
          if [ -n "$_APPLE_ID" ]; then
            echo "APPLE_ID=$_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$_APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "Apple notarization credentials are set."
          else
            echo "APPLE_ID not configured — macOS app will not be notarized."
          fi

      - name: Build & publish release
        working-directory: artifacts/electron-journal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Stops macOS runner from auto-discovering a local Keychain identity
          # on machines where one might exist (e.g. a developer's laptop running
          # act).  Signing is controlled exclusively by the CSC_LINK secret set
          # in the step above.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          pnpm run build
          # On macOS, electron-builder.yml has notarize: true which reads
          # APPLE_TEAM_ID from the environment.  When that variable is absent
          # (no notarization secrets configured) we must override the YAML
          # value to false, or electron-builder will error instead of skipping.
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -z "$APPLE_TEAM_ID" ]; then
            echo "APPLE_TEAM_ID not set — disabling notarization for this build."
            pnpm exec electron-builder --publish always --config.mac.notarize=false
          else
            pnpm exec electron-builder --publish always
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ matrix.label }}
          path: |
            artifacts/electron-journal/release/**/*.log
            artifacts/electron-journal/release/**/*.yaml
            artifacts/electron-journal/release/**/*.yml
          retention-days: 7

  # ── Phase 3: publish the draft once all builds succeed ───────────────────────
  publish-release:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Un-draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
