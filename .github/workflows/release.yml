name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Guard: ensure the pushed tag matches the version in package.json ──────────
  # This prevents a common mistake where a developer bumps the tag but forgets
  # to update package.json (or vice-versa), which would publish assets whose
  # feed files report a version different from the GitHub Release tag and break
  # electron-updater's version comparison.
  validate:
    name: Validate tag vs package.json version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches package version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./artifacts/electron-journal/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json reports $PKG_VERSION but the tag is $GITHUB_REF_NAME (expected v$PKG_VERSION)"
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

  # ── Build & publish one installer per platform ────────────────────────────────
  # All three matrix jobs run concurrently and each calls electron-builder
  # --publish always, which creates the GitHub Release on the first job to finish
  # and uploads assets from every job.  electron-builder uses a conditional
  # create-or-update strategy so concurrent creation is safe in practice; if you
  # observe intermittent "release already exists" errors in the future, switch to
  # a two-phase flow: create a draft release here, upload assets from the matrix,
  # then a final job publishes the draft.
  release:
    name: Build & publish (${{ matrix.label }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Linux requires these system libraries to build native modules and
      # produce an AppImage.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xvfb \
            fuse \
            libfuse2

      # On Windows and macOS, delete the lockfile before installing so pnpm
      # does a fresh platform-specific resolution and picks up the correct
      # native Rollup binary (@rollup/rollup-win32-x64-msvc etc.).
      # The lockfile was generated on Linux and marks those binaries as '-'
      # (excluded), which persists even with --no-frozen-lockfile.
      - name: Clear lockfile for platform-native resolution
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: rm -f pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # macOS requires an ICNS file for the DMG icon.  Generate it from the
      # committed PNG placeholder using macOS-only iconutil — but only if the
      # source PNG exists (when icons are absent, electron-builder uses the
      # default Electron icon).
      - name: Generate macOS ICNS icon
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          SRC=artifacts/electron-journal/build/icons/icon.png
          if [ ! -f "$SRC" ]; then
            echo "No icon.png found — skipping ICNS generation, using default Electron icon."
            exit 0
          fi
          ICONSET=icon.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size "$SRC" --out "$ICONSET/icon_${size}x${size}.png"
            sips -z $((size*2)) $((size*2)) "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o artifacts/electron-journal/build/icons/icon.icns
          rm -rf "$ICONSET"

      # Rebuild better-sqlite3 against Electron's Node.js headers.
      # We use npx (runs through Node) to avoid the Windows failure where
      # electron-builder's fork/exec tries to run pnpm.cjs as a Win32 binary.
      - name: Rebuild native modules for Electron
        working-directory: artifacts/electron-journal
        shell: bash
        run: npx --yes @electron/rebuild@3 -f -w better-sqlite3

      - name: Build & publish release
        working-directory: artifacts/electron-journal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Windows code signing ──────────────────────────────────────────────
          # WIN_CSC_LINK      Base64-encoded PFX certificate file.
          #                   Encode with: base64 -w0 certificate.pfx
          # WIN_CSC_KEY_PASSWORD  Password protecting the PFX.
          # These are optional: electron-builder skips signing when absent.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # ── macOS code signing ────────────────────────────────────────────────
          # CSC_LINK          Base64-encoded .p12 Developer ID Application cert.
          #                   Encode with: base64 -w0 developer_id.p12
          # CSC_KEY_PASSWORD  Password protecting the .p12.
          # These are optional: electron-builder skips signing when absent.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # ── macOS notarization ────────────────────────────────────────────────
          # APPLE_ID                  Apple ID email used to sign in to App Store Connect.
          # APPLE_APP_SPECIFIC_PASSWORD  App-specific password generated at appleid.apple.com.
          # APPLE_TEAM_ID             10-character Apple Developer Team ID.
          # Notarization is skipped when these are absent.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm release

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ matrix.label }}
          path: |
            artifacts/electron-journal/release/**/*.log
            artifacts/electron-journal/release/**/*.yaml
            artifacts/electron-journal/release/**/*.yml
          retention-days: 7
