name: Build check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build electron app (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Linux requires these system libraries to build native modules and
      # produce an AppImage.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xvfb \
            fuse \
            libfuse2

      # On Windows and macOS, delete the lockfile before installing so pnpm
      # does a fresh platform-specific resolution and picks up the correct
      # native Rollup binary (@rollup/rollup-win32-x64-msvc etc.).
      # The lockfile was generated on Linux and marks those binaries as '-'
      # (excluded), which persists even with --no-frozen-lockfile.
      - name: Clear lockfile for platform-native resolution
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: rm -f pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # macOS requires an ICNS file for the DMG icon.  Generate it from the
      # committed PNG placeholder using macOS-only iconutil — but only if the
      # source PNG exists (when icons are absent, electron-builder uses the
      # default Electron icon, which is fine for development builds).
      - name: Generate macOS ICNS icon
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          SRC=artifacts/electron-journal/build/icons/icon.png
          if [ ! -f "$SRC" ]; then
            echo "No icon.png found — skipping ICNS generation, using default Electron icon."
            exit 0
          fi
          ICONSET=icon.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size "$SRC" --out "$ICONSET/icon_${size}x${size}.png"
            sips -z $((size*2)) $((size*2)) "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o artifacts/electron-journal/build/icons/icon.icns
          rm -rf "$ICONSET"

      # Rebuild better-sqlite3 against Electron's Node.js headers.
      # We use npx (which runs through Node, not fork/exec) to avoid the
      # Windows failure where electron-builder tries to exec pnpm.cjs as a
      # native Win32 binary.  @electron/rebuild auto-detects the electron
      # version from the installed package.
      - name: Rebuild native modules for Electron
        working-directory: artifacts/electron-journal
        shell: bash
        run: npx --yes @electron/rebuild@3 -f -w better-sqlite3

      - name: Build (no publish)
        working-directory: artifacts/electron-journal
        run: pnpm dist

      - name: List release artefacts
        shell: bash
        working-directory: artifacts/electron-journal/release
        run: |
          echo "=== Built artefacts ==="
          ls -lh || true
          find . -maxdepth 2 \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) -exec ls -lh {} \;

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          retention-days: 3
          path: |
            artifacts/electron-journal/release/*.exe
            artifacts/electron-journal/release/*.dmg
            artifacts/electron-journal/release/*.AppImage
